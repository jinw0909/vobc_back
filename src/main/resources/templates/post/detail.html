<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<th:block th:replace="~{layout/head :: head}"></th:block>

<style>
    pre code {
        white-space: pre-wrap;
        word-break: break-word;
    }
</style>

<body>
<style>
    .content-scroll-box {
        max-height: 480px;
        overflow-y: auto;
        overflow-x: hidden;
    }
    .content-scroll-box img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 1rem auto;
        width: 100%;
    }
    .content-scroll-box p {
        margin-bottom: 1rem;
        /*line-height: 1.7;*/
    }
    .content-scroll-box h4,
    .content-scroll-box h5,
    .content-scroll-box h6 {
        margin-top: 1.8rem;
        margin-bottom: 0.8rem;
    }

    .content-scroll-box ul {
        /*margin-left: 1.2rem;*/
        margin-bottom: 1.2rem;
    }

    .content-scroll-box figure > img {
        width: 33%;
    }



    /* Tag editor panel */
    .tag-panel {
        background: #fafafa;
    }

    .tag-item {
        background: #fff;
        border: 1px solid rgba(0,0,0,.08);
        border-radius: 12px;
        padding: .6rem .75rem;
    }

    .tag-chip {
        display: inline-flex;
        align-items: center;
        gap: .4rem;
        padding: .25rem .55rem;
        border-radius: 999px;
        background: rgba(13,110,253,.08);
        color: #0d6efd;
        font-weight: 600;
        font-size: .85rem;
    }

    .tag-actions {
        display: inline-flex;
        align-items: center;
        gap: .35rem;
    }

    .tag-order-input {
        width: 92px;
    }

    .badge-primary-tag {
        background-color: rgba(13,110,253,.12) !important;
        color: #0d6efd !important;
        border: 1px solid rgba(13,110,253,.35) !important;
        font-weight: 700 !important;
    }

    .badge-primary-tag::before{
        content: "대표";
        display: inline-block;
        margin-right: .4rem;
        padding: .1rem .35rem;
        border-radius: 999px;
        background-color: rgba(13,110,253,.18);
        color: #0d6efd;
        font-size: .72rem;
        font-weight: 800;
    }


</style>
<th:block th:replace="~{layout/header :: header}"></th:block>
<div class="container mt-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
        <h2 class="mb-0" th:text="${post.title}">게시글 제목</h2>

        <div class="d-flex flex-wrap align-items-center justify-content-md-end gap-2">

            <!-- 번역 버튼 그룹 -->
            <div class="btn-group" role="group" aria-label="Translate">
                <a class="btn btn-sm lang-btn"
                   th:classappend="${langs.contains('kr')} ? ' btn-primary ' : ' btn-outline-primary'"
                   th:href="@{/post/translate(id=${post.id}, languageCode='kr')}">KR</a>

                <a class="btn btn-sm lang-btn"
                   th:classappend="${langs.contains('jp')} ? ' btn-primary is-selected' : ' btn-outline-primary'"
                   th:href="@{/post/translate(id=${post.id}, languageCode='jp')}">JP</a>

                <a class="btn btn-sm lang-btn"
                   th:classappend="${langs.contains('cn')} ? ' btn-primary is-selected' : ' btn-outline-primary'"
                   th:href="@{/post/translate(id=${post.id}, languageCode='cn')}">CN</a>

                <a class="btn btn-sm lang-btn"
                   th:classappend="${langs.contains('en')} ? ' btn-primary is-selected' : ' btn-outline-primary'"
                   th:href="@{/post/translate(id=${post.id}, languageCode='en')}">EN</a>
            </div>

            <a class="btn btn-sm btn-outline-secondary" th:href="@{/post/update(id=${post.id})}">수정</a>
            <a class="btn btn-sm btn-outline-dark" th:href="@{/post/list}">목록</a>
        </div>
    </div>

    <!-- 메타 정보 영역 -->
    <div class="mb-3 text-muted">
        <span th:text="'작성자: ' + ${post.author}"></span>
        <!--        <span class="ms-3"-->
        <!--              th:text="'작성일: ' + ${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></span>-->
        <!-- ✅ 발행일 (releaseDate) 표시 -->
        <span class="ms-3"
              th:if="${post.releaseDate != null}"
              th:text="'발행일: ' + ${#temporals.format(post.releaseDate, 'yyyy-MM-dd')}"></span>
    </div>

    <!-- ✅ 썸네일 영역 -->
    <div class="mb-3"
         th:if="${post.thumbnail != null and !#strings.isEmpty(post.thumbnail)}">
        <strong>썸네일</strong>
        <div class="mt-2">
            <img th:src="${post.thumbnail}"
                 alt="썸네일"
                 class="img-thumbnail mb-1"
                 style="max-height: 200px;">
            <div class="small text-muted text-truncate"
                 th:text="${post.thumbnail}"></div>
        </div>
    </div>

    <div class="mb-3">
        <strong>요약</strong>
        <p class="form-control-plaintext border rounded p-3 content-scroll-box" th:text="${post.summary} ?: '요약 없음'"></p>
    </div>

    <!-- 태그 섹션 -->
    <div class="mb-4">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div class="d-flex align-items-center gap-2">
                <strong>태그</strong>
                <button type="button"
                        class="btn btn-sm btn-outline-primary"
                        onclick="toggleTagEditor()">
                    태그 수정
                </button>
            </div>
            <small class="text-muted">
                ※ 숫자가 작을수록 우선순위가 높습니다. 저장 시 자동 재정렬됩니다.
            </small>
        </div>

        <!-- 현재 태그 뱃지 표시 영역 -->
        <div class="mt-2" id="tagDisplay">
            <a th:each="pt : ${post.postTags}"
               th:href="@{/tag/posts(id=${pt.tag.id})}"
               class="badge me-1 text-decoration-none"
               th:classappend="${pt.primaryTag} ? 'badge-primary-tag' : 'text-bg-secondary'">
                <span th:text="${pt.tag.name}"></span>
            </a>

            <span th:if="${#lists.isEmpty(post.postTags)}" class="text-muted">
                등록된 태그가 없습니다.
            </span>
        </div>


        <!-- 인라인 태그 편집 패널 -->
        <div id="tagEditorPanel" class="mt-3 border rounded p-3 tag-panel" style="display:none;">

            <!-- ✅ 편집용 리스트 렌더링 영역 -->
            <div id="tagEditList" class="d-flex flex-column gap-2">
                <!-- JS로 렌더링 -->
            </div>

            <hr class="my-3"/>

            <!-- 태그 추가 영역 -->
            <div class="d-flex flex-wrap gap-2 align-items-center">
                <select class="form-select form-select-sm" id="newTagSelect" style="min-width: 220px;">
                    <option value="">태그 선택</option>
                    <option th:each="tag : ${allTags}"
                            th:value="${tag.id}"
                            th:text="${tag.name}"></option>
                </select>
                <button type="button"
                        class="btn btn-sm btn-outline-primary"
                        onclick="onTagAdd()">
                    추가
                </button>
            </div>

        </div>
    </div>

    <div class="mb-4">
        <strong>내용</strong>
        <!-- content 가 HTML이면 th:utext, 순수 텍스트면 th:text -->
<!--        <div class="border rounded p-3 content-scroll-box" th:utext="${post.content}"></div>-->
        <!-- 🔹 탭 버튼 -->
        <ul class="nav nav-tabs" id="contentTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active"
                        data-bs-toggle="tab"
                        data-bs-target="#render-pane"
                        type="button">
                    보기
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link"
                        data-bs-toggle="tab"
                        data-bs-target="#html-pane"
                        type="button">
                    HTML
                </button>
            </li>
        </ul>

        <!-- 🔹 탭 내용 -->
        <div class="tab-content border border-top-0 p-3">

            <!-- ① 실제 렌더링 화면 -->
            <div class="tab-pane fade show active" id="render-pane">
                <div class="border rounded p-3 content-scroll-box" th:utext="${post.content}"></div>
            </div>

            <!-- ② HTML 원문 보기 -->
            <div class="tab-pane fade" id="html-pane">
                <div class="border rounded p-3 content-scroll-box">
                    <pre class="mb-0"><code th:text="${post.content}"></code></pre>
                </div>
            </div>

        </div>
    </div>



    <div th:replace="~{layout/footer :: footer}"></div>

    <!-- 태그 편집용 JS (기존 그대로) -->
    <script th:inline="javascript">
        const postId = [[${post.id}]];

        function toggleTagEditor() {
            const panel = document.getElementById('tagEditorPanel');
            if (!panel) return;

            const isOpening = (!panel.style.display || panel.style.display === 'none');
            panel.style.display = isOpening ? 'block' : 'none';

            if (isOpening) {
                // DOM에서 현재 태그를 읽어서 임시 렌더 (sortOrder는 0으로)
                const badges = document.querySelectorAll('#tagDisplay a.badge');
                const tags = [];
                badges.forEach(a => {
                    const href = a.getAttribute('href') || '';
                    const m = href.match(/id=(\d+)/);
                    const tagId = m ? Number(m[1]) : null;
                    if (tagId) tags.push({ tagId, tagName: a.textContent.trim(), sortOrder: 0 });
                });
                renderTagEditor(tags);
            }
        }


        function renderTagEditor(tags) {
            const list = document.getElementById('tagEditList');
            if (!list) return;

            list.innerHTML = '';

            if (!tags || tags.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'text-muted';
                empty.textContent = '현재 이 게시글에 연결된 태그가 없습니다.';
                list.appendChild(empty);
                return;
            }

            tags.forEach(item => {
                const row = document.createElement('div');
                row.className = 'tag-item d-flex align-items-center justify-content-between flex-wrap gap-2';
                row.dataset.tagId = item.tagId;

                row.innerHTML = `
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <span class="tag-chip">${item.tagName}</span>
                <a class="small text-muted text-decoration-none" href="/tag/posts?id=${item.tagId}">
                    태그 페이지 →
                </a>
            </div>

            <div class="tag-actions">
                <input type="number"
                       class="form-control form-control-sm tag-order-input"
                       value="${item.sortOrder ?? 0}"
                       min="0" />
                <button type="button"
                        class="btn btn-sm btn-outline-secondary"
                        onclick="onTagOrderSubmit(this)">
                    저장
                </button>
                <button type="button"
                        class="btn btn-sm btn-outline-danger"
                        onclick="onTagDelete(this)">
                    삭제
                </button>
            </div>
        `;

                list.appendChild(row);
            });
        }


        function renderTagBadges(tags) {
            const container = document.getElementById('tagDisplay');
            if (!container) return;

            container.innerHTML = '';

            if (!tags || tags.length === 0) {
                const span = document.createElement('span');
                span.classList.add('text-muted');
                span.textContent = '등록된 태그가 없습니다.';
                container.appendChild(span);
                return;
            }

            tags.forEach(item => {
                const a = document.createElement('a');
                a.classList.add('badge', 'text-bg-secondary', 'me-1', 'text-decoration-none');
                a.textContent = item.tagName;
                a.href = `/tag/posts?id=${item.tagId}`;
                container.appendChild(a);
            });
        }

        function onTagOrderSubmit(btnElem) {
            const tr = btnElem.closest('tr');
            const tagId = tr.dataset.tagId;
            const inputElem = tr.querySelector('input[type="number"]');
            const newOrder = inputElem.value || 0;

            const params = new URLSearchParams();
            params.append('postId', postId);
            params.append('tagId', tagId);
            params.append('sortOrder', newOrder);

            adminFetch('/post/tag/order', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params.toString()
            })
                .then(res => {
                    if (!res.ok) throw new Error('서버 오류');
                    return res.json();
                })
                .then(tags => {
                    renderTagEditor(tags);
                    renderTagBadges(tags);
                })
                .catch(err => {
                    console.error(err);
                    alert('우선순위 업데이트 중 오류가 발생했습니다.');
                });
        }

        function onTagDelete(btn) {
            const tr = btn.closest('tr');
            const tagId = tr.dataset.tagId;

            if (!confirm('이 태그를 삭제하시겠습니까?')) return;

            const params = new URLSearchParams();
            params.append('postId', postId);
            params.append('tagId', tagId);

            adminFetch('/post/tag/remove', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params.toString()
            })
                .then(res => {
                    if (!res.ok) throw new Error('서버 오류');
                    return res.json();
                })
                .then(tags => {
                    renderTagEditor(tags);
                    renderTagBadges(tags);
                })
                .catch(err => {
                    console.error(err);
                    alert('태그 삭제 중 오류가 발생했습니다.');
                });
        }

        function onTagAdd() {
            const select = document.getElementById('newTagSelect');
            const tagId = select.value;

            if (!tagId) {
                alert('추가할 태그를 선택해 주세요.');
                return;
            }

            const existingRows = document.querySelectorAll('#tagEditTable tbody tr[data-tag-id]');
            for (let i = 0; i < existingRows.length; i++) {
                if (existingRows[i].dataset.tagId === tagId) {
                    alert('이미 추가된 태그입니다.');
                    return;
                }
            }

            const params = new URLSearchParams();
            params.append('postId', postId);
            params.append('tagId', tagId);

            adminFetch('/post/tag/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params.toString()
            })
                .then(res => {
                    if (!res.ok) throw new Error('서버 오류');
                    return res.json();
                })
                .then(tags => {
                    renderTagEditor(tags);
                    renderTagBadges(tags);
                    select.value = '';
                })
                .catch(err => {
                    console.error(err);
                    alert('태그 추가 중 오류가 발생했습니다.');
                });
        }
    </script>

</div>
</body>
</html>
