<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<th:block th:replace="~{layout/head :: head}"></th:block>

<style>
    .scroll-box {
        max-height: 260px;
        overflow-y: auto;
        border: 1px solid #ced4da;
        border-radius: .375rem;
        padding: .75rem;
        background-color: #f8f9fa;
        font-size: 0.95rem;
    }

    /* 원본 HTML 렌더링 박스(utext) */
    .html-box {
        max-height: 420px;
        overflow-y: auto;
        border: 1px solid #ced4da;
        border-radius: .375rem;
        padding: .75rem;
        background-color: #ffffff;
    }

    .section-title {
        font-weight: 700;
        margin-bottom: .5rem;
    }

    .sub-label {
        font-weight: 700;
        font-size: .9rem;
        margin-bottom: .25rem;
    }

    .html-view img {
        max-width: 100% !important;
        height: auto !important;
    }

    /* width/height attribute가 있어도 뚫지 못하게 */
    .html-view img[width] { width: auto !important; }
    .html-view img[height] { height: auto !important; }

    /* ✅ tiptap editor 영역 */
    #editor {
        min-height: 320px;
        border: 1px solid #ced4da;
        border-radius: .375rem;
        padding: .75rem;
        background: #fff;
    }
</style>

<body>
<th:block th:replace="~{layout/header :: header}"></th:block>

<div class="container mt-5">
    <div class="d-flex align-items-end justify-content-between mb-3">
        <div>
            <h2 class="mb-1">
                번역하기
                <small class="text-muted" th:text="'(언어: ' + ${language.displayName} + ')'"></small>
            </h2>
            <div class="text-muted">
                원본 게시글 ID: <span th:text="${post.id}"></span>
            </div>
        </div>
        <!-- ✅ 뒤로가기(상세로) -->
        <a class="btn btn-outline-secondary"
           th:href="@{/post/{id}(id=${post.id})}">
            ← 상세로 돌아가기
        </a>
    </div>

    <!-- ✅ 2컬럼: 좌(원본) / 우(번역) -->
    <div class="row g-4">

        <!-- =========================
             LEFT: 원본(읽기전용)
        ========================== -->
        <div class="col-12 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="section-title">원본</div>

                    <!-- releaseDate / thumbnail -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <div class="sub-label">발행일 (releaseDate)</div>
                            <div class="form-control-plaintext" th:text="${post.releaseDate}">2025-01-01</div>
                        </div>
                        <div class="col-md-8">
                            <div class="sub-label">썸네일 (thumbnail)</div>
                            <div class="form-control-plaintext text-truncate" th:text="${post.thumbnail}">
                                https://example.com/image.jpg
                            </div>
                            <img th:if="${post.thumbnail}"
                                 th:src="${post.thumbnail}"
                                 alt="Thumbnail preview"
                                 class="img-thumbnail mt-2"
                                 style="max-height: 150px;">
                        </div>
                    </div>

                    <!-- 원본 제목 -->
                    <div class="mb-3">
                        <div class="sub-label">제목</div>
                        <div class="scroll-box" th:text="${post.title}">원본 제목</div>
                    </div>

                    <!-- 원본 요약 -->
                    <div class="mb-3">
                        <div class="sub-label">요약</div>
                        <div class="scroll-box" th:text="${post.summary}">원본 요약</div>
                    </div>

                    <!-- ✅ 원본 내용: HTML 렌더링 -->
                    <div class="mb-3">
                        <div class="sub-label">내용 (HTML 렌더링)</div>
                        <div class="scroll-box html-view html-box" th:utext="${post.content}">
                            원본 내용
                        </div>
                        <div class="form-text text-muted mt-1">
                            * 원본 content를 HTML로 렌더링해서 보여줍니다 (th:utext).
                        </div>
                    </div>

                    <!-- 원본 작가 -->
                    <div class="mb-0">
                        <div class="sub-label">작가</div>
                        <div class="scroll-box" th:utext="${post.author}">원본 작가</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- =========================
             RIGHT: 번역(편집)
        ========================== -->
        <div class="col-12 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="section-title">번역</div>

                    <!-- 번역 폼 -->
                    <form id="translationForm"
                          method="post"
                          enctype="multipart/form-data"
                          th:object="${translationForm}"
                          th:attr="data-post-id=${post.id}, data-lang=${language.code}">

                        <!-- CSRF -->
                        <input type="hidden"
                               th:if="${_csrf != null}"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <!-- 서버로 항상 보내고 싶은 값들 -->
                        <input type="hidden" th:field="*{postId}"/>
                        <input type="hidden" th:field="*{languageCode}"/>

                        <!-- content는 우리가 직접 세팅해서 보낼 hidden 하나만 유지 -->
                        <textarea id="content" name="content" style="display:none;"
                                  th:text="*{content}"></textarea>

                        <!-- 번역 제목 -->
                        <div class="mb-3">
                            <div class="sub-label">번역 제목</div>
                            <input type="text" class="form-control translation-input" th:field="*{title}" data-lockable/>
                        </div>

                        <!-- 번역 요약 -->
                        <div class="mb-3">
                            <div class="sub-label">번역 요약</div>
                            <textarea class="form-control translation-input" rows="4" th:field="*{summary}" data-lockable></textarea>
                        </div>

                        <!-- 번역 내용 -->
                        <div class="mb-3">
                            <div class="sub-label">번역 내용</div>

                            <!-- ✅ 보기 모드 -->
                            <div id="translatedContentView"
                                 class="border rounded p-2 html-view scroll-box html-box"
                                 style="min-height:220px;"
                                 th:utext="*{content}">
                            </div>

                            <!-- ✅ 편집 모드 (Tiptap) -->
                            <div id="translatedContentEditorWrap" style="display:none;">
                                <div class="d-flex flex-wrap gap-2 mb-2 align-items-center">
                                    <div class="btn-group btn-group-sm" role="group">
                                        <button type="button" class="btn btn-outline-secondary" id="btnBold"><b>B</b></button>
                                        <button type="button" class="btn btn-outline-secondary" id="btnItalic"><i>I</i></button>
                                        <button type="button" class="btn btn-outline-secondary" id="btnUnderline"><u>U</u></button>
                                    </div>

                                    <div class="btn-group btn-group-sm" role="group">
                                        <button type="button" class="btn btn-outline-secondary" id="btnLink"><i class="fa fa-link"></i></button>
                                        <button type="button" class="btn btn-outline-secondary" id="btnUnlink"><i class="fa fa-unlink"></i></button>
                                    </div>

                                    <div class="btn-group btn-group-sm" role="group">
                                        <button type="button" class="btn btn-outline-secondary" id="btnBullet"><i class="fa fa-list-ul"></i></button>
                                        <button type="button" class="btn btn-outline-secondary" id="btnNumber"><i class="fa fa-list-ol"></i></button>
                                    </div>

                                    <div class="btn-group btn-group-sm" role="group">
                                        <button type="button" class="btn btn-outline-secondary" id="btnSmall">12px</button>
                                        <button type="button" class="btn btn-outline-secondary" id="btnP">본문</button>
                                        <button type="button" class="btn btn-outline-secondary" id="btnH1">H1</button>
                                        <button type="button" class="btn btn-outline-secondary" id="btnH2">H2</button>
                                        <button type="button" class="btn btn-outline-secondary" id="btnH3">H3</button>
                                    </div>

                                    <button type="button" class="btn btn-outline-secondary btn-sm" id="btnInsertImage">
                                        <i class="fa fa-image"></i> 이미지
                                    </button>
                                </div>

                                <input type="file" id="editorImageInput" accept="image/*" hidden>
                                <!-- tiptap mount -->
                                <div id="editor"></div>

                                <div class="form-text">
                                    이미지 삽입은 저장 시점에 업로드됩니다. (에디터 내부 미리보기는 blob)
                                </div>
                            </div>
                        </div>

                        <!-- 번역 작가 -->
                        <div class="mb-3">
                            <div class="sub-label">번역 작가</div>
                            <textarea class="form-control translation-input" rows="2" th:field="*{author}" data-lockable></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="button"
                                    class="btn btn-outline-secondary"
                                    id="editBtn"
                                    th:if="${hasTranslation}">
                                수정
                            </button>

                            <button type="button"
                                    class="btn btn-outline-secondary"
                                    id="cancelBtn"
                                    style="display:none;">
                                취소
                            </button>

                            <button type="button"
                                    class="btn btn-primary"
                                    id="saveBtn">
                                저장
                            </button>
                        </div>

                        <div class="mt-3 text-danger" id="errorBox" style="display:none;"></div>
                    </form>

                    <!-- 번역이 있을 때만 삭제 버튼 노출(기존 유지) -->
                    <form th:if="${hasTranslation}"
                          th:action="@{/post/translate/delete}"
                          method="post"
                          class="mt-3">

                        <input type="hidden" name="postId" th:value="${post.id}">
                        <input type="hidden" name="languageCode" th:value="${languageCode}">

                        <input type="hidden"
                               th:if="${_csrf != null}"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <button type="submit"
                                class="btn btn-danger btn-sm"
                                onclick="return confirm('정말 이 언어의 번역을 삭제하시겠습니까?');">
                            이 번역 삭제
                        </button>
                    </form>

                </div>
            </div>
        </div>

    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const hasTranslation = /*[[${hasTranslation}]]*/ false;

    const formEl = document.getElementById('translationForm');
    const editBtn = document.getElementById('editBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const saveBtn = document.getElementById('saveBtn');

    const viewDiv = document.getElementById('translatedContentView');
    const editorWrap = document.getElementById('translatedContentEditorWrap');

    const content = document.getElementById('content');
    const errorBox = document.getElementById('errorBox');

    let originalHtmlForCancel = '';

    function showError(msg) {
        if (!errorBox) return;
        errorBox.style.display = 'block';
        errorBox.textContent = msg ?? '오류가 발생했습니다.';
    }
    function clearError() {
        if (!errorBox) return;
        errorBox.style.display = 'none';
        errorBox.textContent = '';
    }

    function lockFields() {
        const lockables = formEl.querySelectorAll('[data-lockable]');
        lockables.forEach(el => el.setAttribute('readonly', 'readonly'));
        if (saveBtn) saveBtn.disabled = true;
    }

    function unlockFields() {
        const lockables = formEl.querySelectorAll('[data-lockable]');
        lockables.forEach(el => el.removeAttribute('readonly'));
        if (saveBtn) saveBtn.disabled = false;
    }

    function showEditor() {
        if (viewDiv) viewDiv.style.display = 'none';
        if (editorWrap) editorWrap.style.display = 'block';
    }
    function showView() {
        if (editorWrap) editorWrap.style.display = 'none';
        if (viewDiv) viewDiv.style.display = 'block';
    }

    function enterViewMode() {
        clearError();

        if (originalHtmlForCancel) {
            if (viewDiv) viewDiv.innerHTML = originalHtmlForCancel;
            if (content) content.value = originalHtmlForCancel;

            if (window.__TIPTAP_EDITOR__) {
                window.__TIPTAP_EDITOR__.commands.setContent(originalHtmlForCancel, false);
            }
        }

        // 기존 번역이면 편집 잠금
        if (hasTranslation && window.__TIPTAP_EDITOR__) {
            window.__TIPTAP_EDITOR__.setEditable(false);
        }

        showView();
        lockFields();

        if (editBtn) editBtn.style.display = hasTranslation ? 'inline-block' : 'none';
        if (cancelBtn) cancelBtn.style.display = 'none';
    }

    function enterEditMode({ showCancelBtn = true } = {}) {
        clearError();

        // 스냅샷 저장(취소용) - viewDiv 기준이 가장 안전
        originalHtmlForCancel = viewDiv?.innerHTML || content?.value || '';

        // tiptap이 읽는 hidden 먼저 세팅
        if (content) content.value = originalHtmlForCancel;

        unlockFields();
        showEditor();

        const ed = window.__TIPTAP_EDITOR__;
        if (ed) {
            ed.setEditable(true);
            ed.commands.setContent(originalHtmlForCancel || '<p></p>', false);
        }

        if (editBtn) editBtn.style.display = 'none';
        if (cancelBtn) cancelBtn.style.display = showCancelBtn ? 'inline-block' : 'none';
    }

    function getCsrfHeader() {
        const headerName = /*[[${_csrf?.headerName}]]*/ null;
        const token = /*[[${_csrf?.token}]]*/ null;
        if (!headerName || !token) return null;
        return { headerName, token };
    }

    function buildSaveUrl() {
        const postId = formEl?.dataset?.postId;
        const lang = formEl?.dataset?.lang;
        if (!postId || !lang) throw new Error('data-post-id / data-lang 가 없습니다.');
        return `/post/translate/${encodeURIComponent(postId)}?lang=${encodeURIComponent(lang)}`;
    }

    async function doSave() {
        clearError();

        // 기존 번역인데 잠금이면 저장 막기
        if (hasTranslation && saveBtn && saveBtn.disabled) return;

        // tiptap payload (content + files)
        const payload = window.getEditorPayload
            ? window.getEditorPayload()
            : { content: content?.value || '', files: [] };

        if (content) content.value = payload.content;

        const fd = new FormData(formEl);
        fd.delete('content');
        fd.append('content', payload.content);

        for (const f of (payload.files || [])) fd.append('files', f);

        const headers = {};
        const csrf = getCsrfHeader();
        if (csrf) headers[csrf.headerName] = csrf.token;

        try {
            if (saveBtn) {
                saveBtn.disabled = true;
                saveBtn.dataset._txt = saveBtn.textContent;
                saveBtn.textContent = '저장 중...';
            }

            const url = buildSaveUrl();
            const res = await fetch(url, { method: 'POST', body: fd, headers });
            if (!res.ok) throw new Error(await res.text());

            const data = await res.json();
            if (!data?.ok) throw new Error('서버 응답이 ok=false 입니다.');

            window.location.href = `/post/translate?id=${data.postId}&languageCode=${data.lang}`;
        } catch (err) {
            console.error(err);
            showError('저장 실패: ' + (err?.message ?? err));
            if (saveBtn) saveBtn.disabled = false;
        } finally {
            if (saveBtn && saveBtn.dataset._txt) {
                saveBtn.textContent = saveBtn.dataset._txt;
                delete saveBtn.dataset._txt;

                // 기존 번역 + 뷰모드면 저장 비활성 유지
                if (hasTranslation && editorWrap?.style?.display === 'none') saveBtn.disabled = true;
                else saveBtn.disabled = false;
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        // hidden 초기값 방어
        if (content && !content.value) {
            // 뷰에 렌더된 html을 가져오거나 최소 빈 문단
            content.value = viewDiv?.innerHTML || '<p></p>';
        }

        // tiptap/editor.js가 자동 init 해준 후, 기존 번역이면 잠금
        if (hasTranslation) {
            lockFields();
            if (window.__TIPTAP_EDITOR__) window.__TIPTAP_EDITOR__.setEditable(false);
            showView();

            if (editBtn) editBtn.style.display = 'inline-block';
            if (cancelBtn) cancelBtn.style.display = 'none';
            if (saveBtn) saveBtn.disabled = true;
        } else {
            // 신규 번역: 바로 edit
            unlockFields();
            if (editBtn) editBtn.style.display = 'none';
            if (cancelBtn) cancelBtn.style.display = 'none';

            // 신규는 바로 편집 모드
            originalHtmlForCancel = content.value || '<p></p>';
            if (content) content.value = originalHtmlForCancel;

            showEditor();

            if (window.__TIPTAP_EDITOR__) {
                window.__TIPTAP_EDITOR__.setEditable(true);
                window.__TIPTAP_EDITOR__.commands.setContent(originalHtmlForCancel, false);
            }

            if (saveBtn) saveBtn.disabled = false;
        }

        editBtn?.addEventListener('click', () => enterEditMode({ showCancelBtn: true }));
        cancelBtn?.addEventListener('click', enterViewMode);
        saveBtn?.addEventListener('click', doSave);

        formEl?.addEventListener('submit', (e) => e.preventDefault());
    });
    /*]]>*/
</script>

<!-- ✅ 너가 올린 tiptap 모듈(자동 초기화 + getEditorPayload 제공) -->
<script type="module" th:src="@{/tiptap/editor.js}"></script>

</body>
</html>
